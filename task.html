<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daybook — Task Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&family=Caveat:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
 
</head>
<body>

  <div class="page">

    
    <header class="header">
      <p class="eyebrow">my little daybook</p>
      <h1 class="title">okay, let's get through today</h1>
      <p id="dateLine" class="date-line"></p>
    </header>

  
    <section class="composer">
      <form id="taskForm" class="composer-form">
        <input
          type="text"
          id="taskInput"
          class="task-input"
          placeholder="what's on your mind..."
          autocomplete="off"
          required
        />
        <select id="prioritySelect" class="priority-select">
          <option value="low">Low</option>
          <option value="medium" selected>Medium</option>
          <option value="high">High</option>
        </select>
        <button type="submit" class="add-btn">add it</button>
      </form>
    </section>

    
    <section class="controls">
      <div class="filters" id="filters">
        <button class="filter-btn active" data-filter="all">all</button>
        <button class="filter-btn" data-filter="active">still todo</button>
        <button class="filter-btn" data-filter="completed">done</button>
      </div>
      <p class="stats" id="statsLine">0 tasks</p>
    </section>

 
    <main>
      <ul id="taskList" class="task-list"></ul>
      <p id="emptyState" class="empty-state">nothing here yet — add something above ✎</p>
    </main>

    
    <footer class="footer">
      <button id="clearCompleted" class="clear-btn">clear the done ones</button>
      <p class="footer-note">it saves itself, don't worry.</p>
    </footer>

  </div>

  <script src="script.js"></script>
</body>
</html>
